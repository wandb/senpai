name: OpenHands runtime tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.10.9"

      - name: Install runtime test dependencies
        run: |
          uv lock --check
          uv venv --python 3.13
          uv pip install --python .venv/bin/python \
            pytest \
            psutil \
            python-dotenv \
            simple-parsing \
            "exa-py @ https://github.com/exa-labs/exa-py/archive/71f315b4be07d474df128c8fafc70cc7d0e47b56.tar.gz" \
            "weave>=0.53.1,<0.54" \
            "weave-openhands @ git+https://github.com/morganmcg1/weave-openhands.git@c1e9cda697e10ee92e5629b19c7d81cac8bcf54b" \
            "openhands-sdk @ git+https://github.com/morganmcg1/software-agent-sdk.git@main#subdirectory=openhands-sdk" \
            "openhands-tools @ git+https://github.com/morganmcg1/software-agent-sdk.git@main#subdirectory=openhands-tools"

      - name: Test the complete control plane (no cluster)
        run: .venv/bin/python -m pytest
