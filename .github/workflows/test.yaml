name: OpenHands runtime tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.10.9"

      - name: Install runtime test dependencies
        run: |
          uv lock --check
          uv venv --python 3.13
          uv export --locked --python 3.13 --no-dev --no-emit-project \
            --format requirements.txt \
            --prune torch \
            --prune torchvision \
            --prune torch-geometric \
            --prune timm \
            --prune einops \
            --prune matplotlib \
            > /tmp/senpai-runtime-requirements.txt
          uv pip install --python .venv/bin/python \
            --only-binary cryptography \
            --only-binary jiter \
            --only-binary litellm \
            --only-binary pycparser \
            --only-binary pydantic-core \
            --only-binary rpds-py \
            pytest \
            -r /tmp/senpai-runtime-requirements.txt

      - name: Test the complete control plane (no cluster)
        run: .venv/bin/python -m pytest
