name: OpenHands runtime tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.10.9"

      - name: Install runtime test dependencies
        run: |
          uv lock --check --python "${{ matrix.python-version }}"
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python \
            pytest \
            psutil \
            python-dotenv \
            simple-parsing \
            "wandb>=0.30.0" \
            "exa-py>=2.22.2" \
            "litellm>=1.102.1" \
            "binaryornot==0.4.4" \
            "weave>=0.53.11,<0.54" \
            "weave-openhands @ git+https://github.com/morganmcg1/weave-openhands.git@bdc58d4190c3df064fc3fe173de76c510bf15abf" \
            "openhands-sdk @ git+https://github.com/morganmcg1/software-agent-sdk.git@03b60423725411ad485b665009024b6444694cc7#subdirectory=openhands-sdk" \
            "openhands-tools @ git+https://github.com/morganmcg1/software-agent-sdk.git@03b60423725411ad485b665009024b6444694cc7#subdirectory=openhands-tools"

      - name: Test the complete control plane (no cluster)
        run: .venv/bin/python -m pytest
