name: Build and Push Senpai Images

on:
  push:
    branches: [main, docker]
  pull_request: {}
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [advisor, student, cutoff]
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.role }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' && matrix.role == 'advisor' }}
          pull: true
          no-cache: true
          build-args: |
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install pinned Kind
        if: github.event_name == 'pull_request' && matrix.role == 'advisor'
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind' | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      - name: Run Kubernetes production canary
        if: github.event_name == 'pull_request' && matrix.role == 'advisor'
        env:
          BASE_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ env.SOURCE_REVISION }}
          CANARY_IMAGE: senpai-kubernetes-canary:sha-${{ env.SOURCE_REVISION }}
          DIAGNOSTICS_DIR: ${{ runner.temp }}/senpai-kubernetes-canary
          SENPAI_CANARY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/test-kubernetes-canary.sh

      - name: Upload Kubernetes canary diagnostics
        if: failure() && github.event_name == 'pull_request' && matrix.role == 'advisor'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubernetes-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/senpai-kubernetes-canary
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove exact Kubernetes canary cluster
        if: always() && github.event_name == 'pull_request' && matrix.role == 'advisor'
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name "senpai-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          fi
