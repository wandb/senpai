name: Build and Push Senpai Images

on:
  push:
    branches: [main, docker]
  pull_request: {}
  workflow_dispatch:

# A new push to a pull request supersedes its running checks. Pushes to
# branches and manual runs each get their own group and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [advisor, student, executor, cutoff]
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.role }}
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Decide whether this run needs the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE: ${{ matrix.role }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
          IMAGE_INPUTS: '^(Dockerfile\.student$|pyproject\.toml$|uv\.lock$|scripts/|\.github/workflows/build\.yaml$)'
        run: |
          # The student image differs from the advisor image by its CUDA base and
          # training stack, and pulling that base takes longer than every other
          # check. A pull request that leaves the student's own inputs alone is
          # validated by the advisor build and skips the student build.
          build=true
          if [ "$EVENT_NAME" = pull_request ] && [ "$ROLE" = student ]; then
            changed=$(gh api --paginate "$PULL_REQUEST_FILES" --jq '.[].filename')
            grep -qE "$IMAGE_INPUTS" <<< "$changed" || build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.image.outputs.build == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.image.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}

      - name: Build and push
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: ${{ github.event_name != 'pull_request' }}
          # A pull request's image is never used, so it stays in the build cache.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || '' }}
          pull: true
          # The published image carries its layer cache, so a pull request that
          # leaves the lock alone reuses the dependency and browser layers.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: ${{ github.event_name != 'pull_request' && 'type=inline' || '' }}
          build-args: |
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Targets build Dockerfile.student-on-base on their own base image and publish
  # the result themselves (see README). This job only keeps the Dockerfile
  # building, on a small Debian base whose Python differs from Senpai's.
  build-student-on-base:
    runs-on: ubuntu-latest
    env:
      CHECK_BASE_IMAGE: python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
      CHECK_TARGET_PYTHON: /usr/local/bin/python3
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Decide whether this run needs the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
          IMAGE_INPUTS: '^(Dockerfile\.student-on-base$|pyproject\.toml$|uv\.lock$|scripts/|\.github/workflows/build\.yaml$)'
        run: |
          # This image copies the same code as the advisor image, so a pull
          # request that leaves its own inputs alone is covered by that build.
          build=true
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(gh api --paginate "$PULL_REQUEST_FILES" --jq '.[].filename')
            grep -qE "$IMAGE_INPUTS" <<< "$changed" || build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.image.outputs.build == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Build without publishing
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.student-on-base
          push: false
          outputs: type=cacheonly
          pull: true
          build-args: |
            BASE_IMAGE=${{ env.CHECK_BASE_IMAGE }}
            TARGET_PYTHON=${{ env.CHECK_TARGET_PYTHON }}
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
