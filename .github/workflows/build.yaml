name: Build and Push Senpai Images

on:
  push:
    branches: [main, docker]
  pull_request: {}
  workflow_dispatch:
    inputs:
      student_base_image:
        description: >-
          Optional digest-pinned Debian or Ubuntu image to build an extra
          student image on with Dockerfile.student-on-base
        type: string
        default: ""
      student_base_python:
        description: Interpreter in student_base_image that target code uses
        type: string
        default: /usr/bin/python3

env:
  REGISTRY: ghcr.io
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [advisor, student, executor, cutoff]
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.role }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: true
          build-args: |
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-student-on-base:
    if: github.event_name == 'workflow_dispatch' && inputs.student_base_image != ''
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.repository }}-student-on-base
      STUDENT_BASE_IMAGE: ${{ inputs.student_base_image }}
      STUDENT_BASE_PYTHON: ${{ inputs.student_base_python }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Require a digest-pinned base image
        run: |
          case "$STUDENT_BASE_IMAGE" in
            *@sha256:*) ;;
            *) echo "student_base_image must be pinned by @sha256 digest" >&2; exit 1 ;;
          esac

      # Base images such as SGLang's are tens of gigabytes once extracted.
      - name: Free disk space and move Docker to the larger disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/lib/jvm /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/powershell /usr/share/dotnet /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          config=$( (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') \
            | jq '. + {"data-root": "/mnt/docker"}')
          echo "$config" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.base.name=${{ env.STUDENT_BASE_IMAGE }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.student-on-base
          push: true
          pull: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ env.STUDENT_BASE_IMAGE }}
            TARGET_PYTHON=${{ env.STUDENT_BASE_PYTHON }}
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report the pinned image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "student_image: $REGISTRY/$IMAGE_NAME@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "senpai_repo_revision: $SOURCE_REVISION" | tee -a "$GITHUB_STEP_SUMMARY"
