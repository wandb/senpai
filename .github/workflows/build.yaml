name: Build and Push Senpai Images

on:
  push:
    branches: [main, docker]
  pull_request: {}
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [advisor, student, executor, cutoff]
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.role }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: true
          build-args: |
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Targets build Dockerfile.student-on-base on their own base image and publish
  # the result themselves (see README). This job only keeps the Dockerfile
  # building, on a small Debian base whose Python differs from Senpai's.
  build-student-on-base:
    runs-on: ubuntu-latest
    env:
      CHECK_BASE_IMAGE: python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
      CHECK_TARGET_PYTHON: /usr/local/bin/python3
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.student-on-base
          push: false
          pull: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ env.CHECK_BASE_IMAGE }}
            TARGET_PYTHON=${{ env.CHECK_TARGET_PYTHON }}
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
