name: Build and Push Senpai Images

on:
  push:
    branches: [main, docker]
  pull_request: {}
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      roles: ${{ steps.roles.outputs.roles }}
    steps:
      - name: Choose the images to build
        id: roles
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
          STUDENT_INPUTS: '^(Dockerfile\.student$|pyproject\.toml$|uv\.lock$|scripts/|\.github/workflows/build\.yaml$)'
        run: |
          # The student image differs from the advisor image by its CUDA base and
          # training stack, and pulling that base takes longer than every other
          # check. A pull request that leaves the student's own inputs alone is
          # validated by the advisor build and skips the student build.
          roles='["advisor", "student", "executor", "cutoff"]'
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(gh api --paginate "$PULL_REQUEST_FILES" --jq '.[].filename')
            if ! grep -qE "$STUDENT_INPUTS" <<< "$changed"; then
              roles='["advisor", "executor", "cutoff"]'
            fi
          fi
          echo "Building $roles"
          echo "roles=$roles" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.plan.outputs.roles) }}
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.role }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          build-args: |
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Targets build Dockerfile.student-on-base on their own base image and publish
  # the result themselves (see README). This job only keeps the Dockerfile
  # building, on a small Debian base whose Python differs from Senpai's.
  build-student-on-base:
    runs-on: ubuntu-latest
    env:
      CHECK_BASE_IMAGE: python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
      CHECK_TARGET_PYTHON: /usr/local/bin/python3
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.student-on-base
          push: false
          pull: true
          build-args: |
            BASE_IMAGE=${{ env.CHECK_BASE_IMAGE }}
            TARGET_PYTHON=${{ env.CHECK_TARGET_PYTHON }}
            SENPAI_SOURCE_REVISION=${{ env.SOURCE_REVISION }}
