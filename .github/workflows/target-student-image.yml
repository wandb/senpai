# Builds a target's student image: Dockerfile.student-on-base at a Senpai revision,
# layered on the target's digest-pinned base image. This branch stays off main so
# Senpai's core remains target-agnostic. To build, edit .github/target-student-image.env
# and push this branch; the run summary prints the launch settings.
name: Build a target student image

on:
  push:
    branches: [target-student-images]
    paths:
      - .github/target-student-image.env
      - .github/workflows/target-student-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: target-student-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wandb/senpai-student-on-base

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Read the build settings
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: settings
          sparse-checkout: .github/target-student-image.env
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the build settings
        run: |
          set -a; source settings/.github/target-student-image.env; set +a
          [[ "$SENPAI_REVISION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "SENPAI_REVISION must be a full 40-character commit" >&2; exit 1; }
          case "$BASE_IMAGE" in
            *@sha256:*) ;;
            *) echo "BASE_IMAGE must be pinned by @sha256 digest" >&2; exit 1 ;;
          esac
          [ -n "$BASE_PYTHON" ] || { echo "BASE_PYTHON is required" >&2; exit 1; }
          base_digest="${BASE_IMAGE##*@sha256:}"
          {
            echo "SENPAI_REVISION=$SENPAI_REVISION"
            echo "BASE_IMAGE=$BASE_IMAGE"
            echo "BASE_PYTHON=$BASE_PYTHON"
            echo "TAG=senpai-${SENPAI_REVISION:0:9}-base-${base_digest:0:12}"
          } >> "$GITHUB_ENV"

      # Base images such as SGLang's are tens of gigabytes once extracted.
      - name: Free disk space and move Docker to the larger disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/lib/jvm /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/powershell /usr/share/dotnet /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          config=$( (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') \
            | jq '. + {"data-root": "/mnt/docker"}')
          echo "$config" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt

      - name: Check out Senpai at the launch revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SENPAI_REVISION }}
          path: senpai
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default docker driver exports the finished image into the daemon's
      # store before pushing. With a base image this large that export died
      # silently twice on 2026-10-28, so BuildKit pushes straight to GHCR.
      - name: Set up a BuildKit builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: senpai
          file: senpai/Dockerfile.student-on-base
          push: true
          pull: true
          no-cache: true
          # Keep the published image a plain manifest, as earlier builds were.
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            TARGET_PYTHON=${{ env.BASE_PYTHON }}
            SENPAI_SOURCE_REVISION=${{ env.SENPAI_REVISION }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.SENPAI_REVISION }}
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}

      - name: Report the launch settings
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '```yaml'
            echo "student_image: $IMAGE@$DIGEST"
            echo "advisor_image: ghcr.io/wandb/senpai-advisor:sha-$SENPAI_REVISION"
            echo "senpai_repo_revision: $SENPAI_REVISION"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
