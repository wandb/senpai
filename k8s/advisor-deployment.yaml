# SPDX-PackageName: senpai
#
# The advisor: a lightweight deployment (no GPU) that runs OpenHands
# to manage research hypotheses via GitHub PRs.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ADVISOR_DEPLOYMENT_NAME}}
  annotations:
    senpai.wandb.com/source-revision: "{{REPO_REVISION}}"
    senpai.wandb.com/advisor-branch: {{ADVISOR_BRANCH_JSON}}
    senpai.wandb.com/student-names: "{{STUDENT_NAMES}}"
{{REPAIR_PROTOCOL_ANNOTATION}}
  labels:
    app: senpai
    role: advisor
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      role: advisor
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      annotations:
        senpai.wandb.com/content-hash: "{{POD_CONFIG_HASH}}"
      labels:
        app: senpai
        role: advisor
        research-tag: {{RESEARCH_TAG}}
{{SUPERVISOR_ACCESS_LABEL}}
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
{{ROLE_INIT_CONTAINERS}}
      containers:
      - name: advisor
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          rm -f "/var/lib/senpai/$RESEARCH_TAG/advisor/openhands_state/controller-lease.json"
{{ROLE_BOOTSTRAP}}
          token_handoff=/tmp/senpai-supervisor-github-token
          umask 077
          printf '%s' "$GITHUB_TOKEN" > "$token_handoff"
          export SENPAI_GITHUB_TOKEN_FILE="$token_handoff"
          unset GITHUB_TOKEN GH_TOKEN
          exec bash k8s/entrypoint-advisor.sh
        envFrom:
        - configMapRef:
            name: {{ADVISOR_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        {{MODEL_PROVIDER_ENV}}
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: hf-token
              optional: true
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/$RESEARCH_TAG/advisor/openhands_state/controller-lease.json"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/$RESEARCH_TAG/advisor/openhands_state/controller-lease.json"
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          terminationGracePeriodSeconds: 75
        volumeMounts:
{{ROLE_WORKSPACE_MOUNTS}}
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
        - name: state
          mountPath: /var/lib/senpai
{{REPAIR_CONTAINER}}
      volumes:
{{ROLE_WORKSPACE_VOLUMES}}
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      - name: state
        emptyDir: {}
{{REPAIR_VOLUMES}}
