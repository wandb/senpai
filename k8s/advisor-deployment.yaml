# SPDX-PackageName: senpai
#
# The advisor: a lightweight deployment (no GPU) that runs OpenHands
# to manage research hypotheses via GitHub PRs.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ADVISOR_DEPLOYMENT_NAME}}
  labels:
    app: senpai
    role: advisor
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      role: advisor
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      annotations:
        senpai.wandb.com/content-hash: "{{POD_CONFIG_HASH}}"
      labels:
        app: senpai
        role: advisor
        research-tag: {{RESEARCH_TAG}}
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: advisor
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          rm -f "/var/lib/senpai/$RESEARCH_TAG/advisor/openhands_state/controller-lease.json"
          askpass=/tmp/senpai-git-askpass
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "$GITHUB_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          mkdir -p /workspace
          git init /workspace/senpai
          if git -C /workspace/senpai remote get-url origin >/dev/null 2>&1; then
            git -C /workspace/senpai remote set-url origin "$SENPAI_REPO_URL"
          else
            git -C /workspace/senpai remote add origin "$SENPAI_REPO_URL"
          fi
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C /workspace/senpai fetch --depth 1 "$SENPAI_REPO_URL" "$SENPAI_REPO_REVISION"
          git -C /workspace/senpai checkout --detach FETCH_HEAD
          cd /workspace/senpai
          test "$(git rev-parse HEAD)" = "$SENPAI_REPO_REVISION"
          test "$SENPAI_IMAGE_REVISION" = "$SENPAI_REPO_REVISION"
          token_handoff=/tmp/senpai-supervisor-github-token
          (umask 077; printf '%s' "$GITHUB_TOKEN" > "$token_handoff")
          export SENPAI_GITHUB_TOKEN_FILE="$token_handoff"
          unset GITHUB_TOKEN GH_TOKEN
          rm -f "$askpass"
          exec bash k8s/entrypoint-advisor.sh
        envFrom:
        - configMapRef:
            name: {{ADVISOR_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
{{MODEL_PROVIDER_ENV}}
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
{{CUSTOM_SECRET_ENV_REFS}}
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/$RESEARCH_TAG/advisor/openhands_state/controller-lease.json"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/$RESEARCH_TAG/advisor/openhands_state/controller-lease.json"
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          terminationGracePeriodSeconds: 75
        volumeMounts:
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
        - name: state
          mountPath: /var/lib/senpai
      volumes:
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      - name: state
        emptyDir: {}
