# SPDX-PackageName: senpai
#
# The advisor: a lightweight deployment (no GPU) that runs Claude Code
# to manage research hypotheses via GitHub PRs. Loops every 5 minutes.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ADVISOR_DEPLOYMENT_NAME}}
  labels:
    app: senpai
    role: advisor
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: senpai
      role: advisor
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      labels:
        app: senpai
        role: advisor
        research-tag: {{RESEARCH_TAG}}
    spec:
      serviceAccountName: senpai-orchestrator
      containers:
      - name: advisor
        image: {{IMAGE}}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          repo_auth_url="$(printf '%s' "$REPO_URL" | sed "s#https://github.com/#https://${GITHUB_TOKEN}@github.com/#")"
          git clone --branch "$REPO_BRANCH" --single-branch --depth 1 --no-tags "$repo_auth_url" /workspace/senpai
          cd /workspace/senpai
          git remote set-url origin "$REPO_URL"
          bash k8s/entrypoint-advisor.sh
        envFrom:
        - configMapRef:
            name: {{ADVISOR_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: senpai-secrets
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: anthropic-api-key
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
      volumes:
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
