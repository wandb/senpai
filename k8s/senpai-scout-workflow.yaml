# Apply this template with `python scripts/apply_scout_workflow.py`; the script
# fills this block from the same root .env used by launch.py and sends it to
# kubectl over stdin.
apiVersion: agentic.coreweave.com/v1alpha1
kind: Workflow
metadata:
  name: senpai-scout-daily
spec:
  agent:
    agentDefinitionName: senpai-scout
    agentDefinitionVersion: main
  environment:
    template: workspaces-agentic
    timeout: 45m
    env:
      SEMANTIC_SCHOLAR_ENDPOINT: "https://api.semanticscholar.org"
    secrets: {}
  parameters:
    - name: research_tag
      type: string
      required: true
    - name: max_launches
      type: string
      required: false
      default: "1"
    - name: focus
      type: string
      required: false
      default: ""
  schedule:
    cron: "0 14 * * *"
    timezone: "UTC"
  steps:
    - name: run
      action: agent.execute
