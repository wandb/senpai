# SPDX-PackageName: senpai

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
subjects:
- kind: ServiceAccount
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SUPERVISOR_DEPLOYMENT_NAME}}
  annotations:
    senpai.wandb.com/source-revision: "{{REPO_REVISION}}"
    senpai.wandb.com/advisor-branch: {{ADVISOR_BRANCH_JSON}}
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      role: supervisor
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      annotations:
        senpai.wandb.com/content-hash: "{{POD_CONFIG_HASH}}"
      labels:
        app: senpai
        role: supervisor
        research-tag: {{RESEARCH_TAG}}
    spec:
      serviceAccountName: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: supervisor
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          askpass=/tmp/senpai-git-askpass
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "$GITHUB_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          mkdir -p /workspace
          git init /workspace/senpai
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C /workspace/senpai fetch --depth 1 "$REPO_URL" "$REPO_REVISION"
          git -C /workspace/senpai checkout --detach FETCH_HEAD
          cd /workspace/senpai
          git remote add origin "$REPO_URL"
          test "$(git rev-parse HEAD)" = "$REPO_REVISION"
          test "$SENPAI_IMAGE_REVISION" = "$REPO_REVISION"
          token_handoff=/tmp/senpai-supervisor-github-token
          umask 077
          printf '%s' "$GITHUB_TOKEN" > "$token_handoff"
          export SENPAI_GITHUB_TOKEN_FILE="$token_handoff"
          unset GITHUB_TOKEN GH_TOKEN
          rm -f "$askpass"
          exec bash k8s/entrypoint-operational-supervisor.sh
        envFrom:
        - configMapRef:
            name: {{SUPERVISOR_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        {{MODEL_PROVIDER_ENV}}
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.operational_supervisor health "/var/lib/senpai/$RESEARCH_TAG/operational-supervisor/lease.json"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.operational_supervisor health "/var/lib/senpai/$RESEARCH_TAG/operational-supervisor/lease.json"
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          terminationGracePeriodSeconds: 75
        volumeMounts:
        - name: state
          mountPath: /var/lib/senpai
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
