# SPDX-PackageName: senpai

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
subjects:
- kind: ServiceAccount
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{SUPERVISOR_DEPLOYMENT_NAME}}
  annotations:
    senpai.wandb.com/source-revision: "{{REPO_REVISION}}"
    senpai.wandb.com/advisor-branch: {{ADVISOR_BRANCH_JSON}}
    senpai.wandb.com/management-protocol: "{{MANAGEMENT_PROTOCOL_VERSION}}"
    senpai.wandb.com/repair-protocol: "{{REPAIR_PROTOCOL_VERSION}}"
  labels:
    app: senpai
    role: supervisor
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      role: supervisor
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      annotations:
        senpai.wandb.com/content-hash: "{{POD_CONFIG_HASH}}"
      labels:
        app: senpai
        role: supervisor
        research-tag: {{RESEARCH_TAG}}
        senpai-supervisor-access: "true"
    spec:
      serviceAccountName: {{SUPERVISOR_SERVICE_ACCOUNT_NAME}}
      automountServiceAccountToken: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: metadata-egress-guard
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["/usr/local/bin/senpai-metadata-egress-guard"]
      - name: state-directory
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eu
          mkdir -p "/state-root/{{SUPERVISOR_STATE_SUBPATH}}"
          chmod 0700 "/state-root/{{SUPERVISOR_STATE_SUBPATH}}"
        volumeMounts:
        - name: state
          mountPath: /state-root
      - name: source
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eu
          askpass=/tmp/senpai-git-askpass
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "$GITHUB_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          git init /workspace/.source
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C /workspace/.source fetch --depth 1 "$REPO_URL" "$REPO_REVISION"
          git -C /workspace/.source checkout --detach FETCH_HEAD
          if git -C /workspace/.source remote get-url origin >/dev/null 2>&1; then
            git -C /workspace/.source remote set-url origin "$REPO_URL"
          else
            git -C /workspace/.source remote add origin "$REPO_URL"
          fi
          test "$(git -C /workspace/.source rev-parse HEAD)" = "$REPO_REVISION"
          test "$SENPAI_IMAGE_REVISION" = "$REPO_REVISION"
          rm -f "$askpass"
          mv /workspace/.source /workspace/senpai
        envFrom:
        - configMapRef:
            name: {{SUPERVISOR_CONFIGMAP_NAME}}
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        volumeMounts:
        - name: runtime
          mountPath: /workspace
        - name: source-tmp
          mountPath: /tmp
      - name: kubeconfig
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eu
          host="$KUBERNETES_SERVICE_HOST"
          case "$host" in
            *:*) host="[$host]" ;;
          esac
          namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
          cat > /var/run/senpai-kubeconfig/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: campaign
            cluster:
              server: https://${host}:${KUBERNETES_SERVICE_PORT_HTTPS}
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          users:
          - name: supervisor
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          contexts:
          - name: campaign
            context:
              cluster: campaign
              namespace: ${namespace}
              user: supervisor
          current-context: campaign
          EOF
          chmod 0600 /var/run/senpai-kubeconfig/config
        volumeMounts:
        - name: service-account
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: kubeconfig
          mountPath: /var/run/senpai-kubeconfig
      containers:
      - name: supervisor-control
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          cd /workspace/senpai
          test "$(git rev-parse HEAD)" = "$REPO_REVISION"
          test "$SENPAI_IMAGE_REVISION" = "$REPO_REVISION"
          exec bash k8s/entrypoint-operational-supervisor.sh
        envFrom:
        - configMapRef:
            name: {{SUPERVISOR_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        {{MODEL_PROVIDER_ENV}}
        - name: KUBECONFIG
          value: /var/run/senpai-kubeconfig/config
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - /opt/senpai-venv/bin/python -I -m senpai_agent.isolated_terminal_health --socket '@senpai-isolated-terminal' && /opt/senpai-venv/bin/python -I -m senpai_agent.repair_broker_health --socket /run/senpai-repair/repair.sock && /opt/senpai-venv/bin/python -I -m senpai_agent.operational_supervisor health "/var/lib/senpai/$RESEARCH_TAG/operational-supervisor/lease.json"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - /opt/senpai-venv/bin/python -I -m senpai_agent.isolated_terminal_health --socket '@senpai-isolated-terminal' && /opt/senpai-venv/bin/python -I -m senpai_agent.repair_broker_health --socket /run/senpai-repair/repair.sock && /opt/senpai-venv/bin/python -I -m senpai_agent.operational_supervisor health "/var/lib/senpai/$RESEARCH_TAG/operational-supervisor/lease.json"
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          terminationGracePeriodSeconds: 75
        volumeMounts:
        - name: runtime
          mountPath: /workspace
          readOnly: true
        - name: state
          mountPath: {{SUPERVISOR_STATE_MOUNT_PATH}}
          subPath: {{SUPERVISOR_STATE_SUBPATH}}
        - name: service-account
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: repair-socket
          mountPath: /run/senpai-repair
        - name: kubeconfig
          mountPath: /var/run/senpai-kubeconfig
          readOnly: true
        - name: control-home
          mountPath: /home/senpai
        - name: control-tmp
          mountPath: /tmp
      - name: supervisor-shell
        image: {{ADVISOR_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eu
          mkdir -p /tmp/senpai-shell-server
          cd /workspace/senpai
          exec /opt/senpai-venv/bin/python -I -m senpai_agent.isolated_terminal serve \
            --socket "$SENPAI_SUPERVISOR_TERMINAL_SOCKET" \
            --workspace /workspaces/supervisor
        env:
        - name: HOME
          value: /tmp/senpai-shell-server
        - name: SENPAI_SUPERVISOR_TERMINAL_SOCKET
          value: "@senpai-isolated-terminal"
        - name: SENPAI_SUPERVISOR_REPAIR_SOCKET
          value: /run/senpai-repair/repair.sock
        - name: SENPAI_RESEARCH_TAG
          value: {{RESEARCH_TAG}}
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
            ephemeral-storage: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
            ephemeral-storage: "20Gi"
        startupProbe:
          exec:
            command: ["/opt/senpai-venv/bin/python", "-I", "-m", "senpai_agent.isolated_terminal_health", "--socket", "@senpai-isolated-terminal"]
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 120
        livenessProbe:
          exec:
            command: ["/opt/senpai-venv/bin/python", "-I", "-m", "senpai_agent.isolated_terminal_health", "--socket", "@senpai-isolated-terminal"]
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 5
        volumeMounts:
        - name: runtime
          mountPath: /workspace
          readOnly: true
        - name: repair-socket
          mountPath: /run/senpai-repair
          readOnly: true
        - name: shell-workspace
          mountPath: /workspaces/supervisor
        - name: shell-tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        emptyDir: {}
      - name: source-tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: state
        persistentVolumeClaim:
          claimName: {{SUPERVISOR_STATE_PVC_CLAIM_NAME}}
      - name: service-account
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: repair-socket
        emptyDir: {}
      - name: shell-workspace
        emptyDir:
          sizeLimit: 8Gi
      - name: shell-tmp
        emptyDir:
          sizeLimit: 8Gi
      - name: control-home
        emptyDir:
          sizeLimit: 4Gi
      - name: control-tmp
        emptyDir:
          sizeLimit: 8Gi
      - name: kubeconfig
        emptyDir: {}
