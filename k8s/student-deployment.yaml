# SPDX-PackageName: senpai
#
# A student is a long-running worker that polls for PR assignments.
# Replace {{STUDENT_NAME}} and {{RESEARCH_TAG}} before applying, or use launch.py.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{STUDENT_DEPLOYMENT_NAME}}
  labels:
    app: senpai
    role: student
    student: {{STUDENT_NAME}}
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      student: {{STUDENT_NAME}}
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      annotations:
        senpai.wandb.com/content-hash: "{{POD_CONFIG_HASH}}"
      labels:
        app: senpai
        role: student
        student: {{STUDENT_NAME}}
        research-tag: {{RESEARCH_TAG}}
    spec:
      serviceAccountName: {{STUDENT_SERVICE_ACCOUNT_NAME}}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: student
        image: {{STUDENT_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          rm -f "/var/lib/senpai/openhands_state/controller-lease.json"
          askpass=/tmp/senpai-git-askpass
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "$GITHUB_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          mkdir -p /workspace
          git init /workspace/senpai
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C /workspace/senpai fetch --depth 1 "$SENPAI_REPO_URL" "$SENPAI_REPO_REVISION"
          git -C /workspace/senpai checkout --detach FETCH_HEAD
          cd /workspace/senpai
          git remote add origin "$SENPAI_REPO_URL"
          test "$(git rev-parse HEAD)" = "$SENPAI_REPO_REVISION"
          test "$SENPAI_IMAGE_REVISION" = "$SENPAI_REPO_REVISION"
          token_handoff=/tmp/senpai-supervisor-github-token
          umask 077
          printf '%s' "$GITHUB_TOKEN" > "$token_handoff"
          export SENPAI_GITHUB_TOKEN_FILE="$token_handoff"
          unset GITHUB_TOKEN GH_TOKEN
          rm -f "$askpass"
          exec bash k8s/entrypoint-student.sh
        envFrom:
        - configMapRef:
            name: {{STUDENT_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        {{MODEL_PROVIDER_ENV}}
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
        resources: {{STUDENT_RESOURCES}}
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/openhands_state/controller-lease.json"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/openhands_state/controller-lease.json"
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          terminationGracePeriodSeconds: 75
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
        - name: state
          mountPath: /var/lib/senpai
        # {{EXECUTOR_SOCKET_MOUNT}}
      # {{KUBERNETES_EXECUTOR_CONTAINER}}
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      - name: state
        emptyDir: {}
      # {{KUBERNETES_EXECUTOR_VOLUMES}}
      nodeSelector: {{STUDENT_NODE_SELECTOR}}
      tolerations: {{STUDENT_TOLERATIONS}}
