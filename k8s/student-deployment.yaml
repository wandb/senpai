# SPDX-PackageName: senpai
#
# A student is a long-running worker that polls for PR assignments.
# Replace {{STUDENT_NAME}} and {{RESEARCH_TAG}} before applying, or use launch.py.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{STUDENT_DEPLOYMENT_NAME}}
  annotations:
    senpai.wandb.com/source-revision: "{{REPO_REVISION}}"
    senpai.wandb.com/advisor-branch: {{ADVISOR_BRANCH_JSON}}
{{REPAIR_PROTOCOL_ANNOTATION}}
  labels:
    app: senpai
    role: student
    student: {{STUDENT_NAME}}
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      student: {{STUDENT_NAME}}
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      annotations:
        senpai.wandb.com/content-hash: "{{POD_CONFIG_HASH}}"
      labels:
        app: senpai
        role: student
        student: {{STUDENT_NAME}}
        research-tag: {{RESEARCH_TAG}}
{{SUPERVISOR_ACCESS_LABEL}}
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
{{ROLE_INIT_CONTAINERS}}
      containers:
      - name: student
        image: {{STUDENT_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          rm -f "/var/lib/senpai/openhands_state/controller-lease.json"
{{ROLE_BOOTSTRAP}}
          token_handoff=/tmp/senpai-supervisor-github-token
          umask 077
          printf '%s' "$GITHUB_TOKEN" > "$token_handoff"
          export SENPAI_GITHUB_TOKEN_FILE="$token_handoff"
          unset GITHUB_TOKEN GH_TOKEN
          exec bash k8s/entrypoint-student.sh
        envFrom:
        - configMapRef:
            name: {{STUDENT_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        {{MODEL_PROVIDER_ENV}}
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: hf-token
              optional: true
        resources:
          requests:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
          limits:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/openhands_state/controller-lease.json"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -m senpai_agent.supervisor health "/var/lib/senpai/openhands_state/controller-lease.json"
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          terminationGracePeriodSeconds: 75
        volumeMounts:
{{ROLE_WORKSPACE_MOUNTS}}
        - name: dshm
          mountPath: /dev/shm
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
        - name: state
          mountPath: /var/lib/senpai
{{REPAIR_CONTAINER}}
      volumes:
{{ROLE_WORKSPACE_VOLUMES}}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      - name: state
        emptyDir: {}
{{REPAIR_VOLUMES}}
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
