# SPDX-PackageName: senpai
#
# A student is a long-running worker that polls for PR assignments.
# Replace {{STUDENT_NAME}} and {{RESEARCH_TAG}} before applying, or use launch.py.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{STUDENT_DEPLOYMENT_NAME}}
  labels:
    app: senpai
    role: student
    student: {{STUDENT_NAME}}
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      student: {{STUDENT_NAME}}
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      annotations:
        senpai.wandb.com/content-hash: "{{POD_CONFIG_HASH}}"
        senpai.wandb.com/wandb-viewer: "{{WANDB_VIEWER}}"
        senpai.wandb.com/controller-wandb-viewer: "{{CONTROLLER_WANDB_VIEWER}}"
        senpai.wandb.com/inference-wandb-viewer: "{{INFERENCE_WANDB_VIEWER}}"
        senpai.program.com/context-secret: "{{PROGRAM_CONTEXT_SECRET_NAME}}"
      labels:
        app: senpai
        role: student
        student: {{STUDENT_NAME}}
        research-tag: {{RESEARCH_TAG}}
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: student
        image: {{STUDENT_IMAGE}}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          rm -f "/var/lib/senpai/openhands_state/controller-lease.json"
          askpass=/tmp/senpai-git-askpass
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "$GITHUB_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          mkdir -p /workspace
          git init /workspace/senpai
          if git -C /workspace/senpai remote get-url origin >/dev/null 2>&1; then
            git -C /workspace/senpai remote set-url origin "$SENPAI_REPO_URL"
          else
            git -C /workspace/senpai remote add origin "$SENPAI_REPO_URL"
          fi
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C /workspace/senpai fetch --depth 1 "$SENPAI_REPO_URL" "$SENPAI_REPO_REVISION"
          git -C /workspace/senpai checkout --detach FETCH_HEAD
          cd /workspace/senpai
          test "$(git rev-parse HEAD)" = "$SENPAI_REPO_REVISION"
          test "$SENPAI_IMAGE_REVISION" = "$SENPAI_REPO_REVISION"
          handoff_dir=$(mktemp -d /tmp/senpai-supervisor.XXXXXX)
          chmod 700 "$handoff_dir"
          token_handoff="$handoff_dir/github-token"
          (umask 077; printf '%s' "$GITHUB_TOKEN" > "$token_handoff")
          wandb_handoff="$handoff_dir/wandb-api-key"
          (umask 077; printf '%s' "$WANDB_API_KEY" > "$wandb_handoff")
          exa_handoff="$handoff_dir/exa-api-key"
          (umask 077; printf '%s' "$EXA_API_KEY" > "$exa_handoff")
          training_wandb_handoff="$handoff_dir/wandb-training-api-key"
          (umask 077; printf '%s' "$SENPAI_WANDB_TRAINING_API_KEY" > "$training_wandb_handoff")
          export SENPAI_GITHUB_TOKEN_FILE="$token_handoff"
          export SENPAI_WANDB_API_KEY_FILE="$wandb_handoff"
          export SENPAI_EXA_API_KEY_FILE="$exa_handoff"
          export SENPAI_WANDB_TRAINING_API_KEY_FILE="$training_wandb_handoff"
          unset GITHUB_TOKEN GH_TOKEN WANDB_API_KEY EXA_API_KEY SENPAI_WANDB_TRAINING_API_KEY
          rm -f "$askpass"
          exec bash k8s/entrypoint-student.sh
        envFrom:
        - configMapRef:
            name: {{STUDENT_CONFIGMAP_NAME}}
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: wandb-api-key
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
        - name: SENPAI_WANDB_TRAINING_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{WANDB_TRAINING_SECRET_NAME}}
              key: wandb-api-key
{{MODEL_PROVIDER_ENV}}
{{CUSTOM_SECRET_ENV_REFS}}
        resources:
          requests:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
          limits:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          terminationGracePeriodSeconds: 75
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
        - name: state
          mountPath: /var/lib/senpai
        - name: program-context
          mountPath: /var/run/senpai-context
          readOnly: true
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      - name: state
        emptyDir: {}
      - name: program-context
        secret:
          secretName: {{PROGRAM_CONTEXT_SECRET_NAME}}
          items:
          - key: program-context
            path: program-context.b64
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
