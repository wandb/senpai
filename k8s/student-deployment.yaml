# SPDX-PackageName: senpai
#
# A student is a long-running worker that polls for PR assignments.
# Replace {{STUDENT_NAME}} and {{RESEARCH_TAG}} before applying, or use launch.py.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{STUDENT_DEPLOYMENT_NAME}}
  labels:
    app: senpai
    role: student
    student: {{STUDENT_NAME}}
    research-tag: {{RESEARCH_TAG}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      student: {{STUDENT_NAME}}
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      labels:
        app: senpai
        role: student
        student: {{STUDENT_NAME}}
        research-tag: {{RESEARCH_TAG}}
    spec:
      containers:
      - name: student
        image: {{IMAGE}}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          repo_auth_url="$(printf '%s' "$REPO_URL" | sed "s#https://github.com/#https://${GITHUB_TOKEN}@github.com/#")"
          git clone --branch "$REPO_BRANCH" --single-branch --depth 1 --no-tags "$repo_auth_url" /workspace/senpai
          cd /workspace/senpai
          git remote set-url origin "$REPO_URL"
          bash k8s/entrypoint-student.sh
        envFrom:
        - configMapRef:
            name: {{STUDENT_CONFIGMAP_NAME}}
        - secretRef:
            name: {{LAUNCH_SECRET_NAME}}
        resources:
          requests:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
          limits:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
