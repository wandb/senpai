# SPDX-PackageName: senpai
#
# Student deployments are long-running workers that poll for PR assignments.
# launch.py renders either one logical student or a grouped student supervisor
# from this template.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{STUDENT_DEPLOYMENT_NAME}}
  labels:
    app: senpai
    role: student
{{STUDENT_METADATA_ID_LABEL}}
    research-tag: {{RESEARCH_TAG}}
  annotations:
    senpai/student-names: "{{STUDENT_NAMES_CSV}}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
{{STUDENT_SELECTOR_ID_LABEL}}
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      labels:
        app: senpai
        role: student
{{STUDENT_TEMPLATE_ID_LABEL}}
        research-tag: {{RESEARCH_TAG}}
      annotations:
        senpai/student-names: "{{STUDENT_NAMES_CSV}}"
    spec:
      containers:
      - name: {{STUDENT_CONTAINER_NAME}}
        image: {{IMAGE}}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          repo_auth_url="$(printf '%s' "$REPO_URL" | sed "s#https://github.com/#https://${GITHUB_TOKEN}@github.com/#")"
          git clone --branch "$REPO_BRANCH" --single-branch --depth 1 --no-tags "$repo_auth_url" {{STUDENT_RUNNER_WORKDIR}}
          git -C {{STUDENT_RUNNER_WORKDIR}} remote set-url origin "$REPO_URL"
          cd {{STUDENT_RUNNER_WORKDIR}}
          bash {{STUDENT_ENTRYPOINT}}
        envFrom:
        - configMapRef:
            name: {{STUDENT_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: senpai-secrets
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: anthropic-api-key
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
        resources:
          requests:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
          limits:
            cpu: "{{STUDENT_CPU}}"
            memory: "{{STUDENT_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
