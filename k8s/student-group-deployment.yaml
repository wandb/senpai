# SPDX-PackageName: senpai
#
# A grouped student deployment runs multiple logical student loops in one GPU
# pod. Each logical student gets an isolated runner and target checkout under
# /workspace/senpai-<student>.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{STUDENT_GROUP_DEPLOYMENT_NAME}}
  labels:
    app: senpai
    role: student
    student-group: {{STUDENT_GROUP_NAME}}
    research-tag: {{RESEARCH_TAG}}
  annotations:
    senpai/student-names: "{{STUDENT_NAMES_CSV}}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senpai
      student-group: {{STUDENT_GROUP_NAME}}
      research-tag: {{RESEARCH_TAG}}
  template:
    metadata:
      labels:
        app: senpai
        role: student
        student-group: {{STUDENT_GROUP_NAME}}
        research-tag: {{RESEARCH_TAG}}
      annotations:
        senpai/student-names: "{{STUDENT_NAMES_CSV}}"
    spec:
      containers:
      - name: student-group
        image: {{IMAGE}}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          repo_auth_url="$(printf '%s' "$REPO_URL" | sed "s#https://github.com/#https://${GITHUB_TOKEN}@github.com/#")"
          git clone --branch "$REPO_BRANCH" --single-branch --depth 1 --no-tags "$repo_auth_url" /workspace/senpai-group
          git -C /workspace/senpai-group remote set-url origin "$REPO_URL"
          cd /workspace/senpai-group
          bash k8s/entrypoint-student-group.sh
        envFrom:
        - configMapRef:
            name: {{STUDENT_GROUP_CONFIGMAP_NAME}}
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: senpai-secrets
              key: wandb-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: github-token
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: anthropic-api-key
        - name: EXA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{LAUNCH_SECRET_NAME}}
              key: exa-api-key
        resources:
          requests:
            cpu: "{{STUDENT_GROUP_CPU}}"
            memory: "{{STUDENT_GROUP_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
          limits:
            cpu: "{{STUDENT_GROUP_CPU}}"
            memory: "{{STUDENT_GROUP_MEMORY}}"
            nvidia.com/gpu: "{{GPUS_PER_STUDENT}}"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: dataset
          mountPath: {{PVC_MOUNT_PATH}}
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: dataset
        persistentVolumeClaim:
          claimName: {{PVC_CLAIM_NAME}}
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
