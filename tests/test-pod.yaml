apiVersion: v1
kind: Pod
metadata:
  name: {{POD_NAME}}
  labels:
    app: senpai
    role: test
    research-tag: {{RESEARCH_TAG}}
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: {{IMAGE}}
    command: ["/bin/bash", "-c"]
    args:
    - |
      if [ "${SENPAI_IMAGE_REVISION}" != "${SENPAI_REPO_REVISION}" ]; then
        echo "Image revision ${SENPAI_IMAGE_REVISION} does not match requested source ${SENPAI_REPO_REVISION}" >&2
        exit 1
      fi
      askpass=/tmp/senpai-test-git-askpass
      printf '%s\n' \
        '#!/bin/sh' \
        'case "$1" in' \
        '  *Username*) printf "%s\n" x-access-token ;;' \
        '  *Password*) printf "%s\n" "$GITHUB_TOKEN" ;;' \
        'esac' > "$askpass"
      chmod 700 "$askpass"
      git init /workspaces/senpai
      GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
        git -C /workspaces/senpai fetch --depth 1 "${SENPAI_REPO_URL}" "${SENPAI_REPO_REVISION}"
      git -C /workspaces/senpai checkout --detach FETCH_HEAD
      test "$(git -C /workspaces/senpai rev-parse HEAD)" = "${SENPAI_REPO_REVISION}"
      sleep infinity
    envFrom:
    - configMapRef:
        name: {{CONFIGMAP_NAME}}
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: "8Gi"
        nvidia.com/gpu: "1"
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
