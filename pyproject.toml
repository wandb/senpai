# SPDX-PackageName: senpai

[project]
name = "senpai"
version = "0.1.0"
requires-python = ">=3.13,!=3.14.1,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "PyYAML",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torch_geometric",
    "einops",
    "timm",
    "rich",
    "python-dotenv",
    "simple-parsing",
    "wandb>=0.30.0",
    "weave>=0.53.11,<0.54",
    "weave-openhands @ git+https://github.com/morganmcg1/weave-openhands.git@bdc58d4190c3df064fc3fe173de76c510bf15abf",
    "litellm>=1.102.1",
    "tqdm",
    "matplotlib",
    "openhands-sdk @ git+https://github.com/morganmcg1/software-agent-sdk.git@03b60423725411ad485b665009024b6444694cc7#subdirectory=openhands-sdk",
    "openhands-tools @ git+https://github.com/morganmcg1/software-agent-sdk.git@03b60423725411ad485b665009024b6444694cc7#subdirectory=openhands-tools",
    "psutil",
    "exa-py>=2.22.2",
]

[tool.setuptools.packages.find]
include = ["senpai_agent*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
exclude-newer = "2026-09-27T00:00:00Z"
constraint-dependencies = [
    "binaryornot==0.4.4", # 0.6 rejects valid CP1251 source as binary.
    "cryptography>=50.0.0", # CVE-2026-69247 / GHSA-g6cj-pr64-35w5
]

[project.optional-dependencies]
dev = [
    "ipython",
    "pytest",
]
