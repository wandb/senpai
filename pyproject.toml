# SPDX-PackageName: senpai

[project]
name = "senpai"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "PyYAML",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torch_geometric",
    "einops",
    "timm",
    "rich",
    "python-dotenv",
    "simple-parsing",
    "wandb",
    "weave>=0.53.1,<0.54",
    "weave-openhands @ git+https://github.com/morganmcg1/weave-openhands.git@49517f08af3996836ecc9c202d8d3ef4130e2a25",
    "tqdm",
    "matplotlib",
    "openhands-sdk @ git+https://github.com/morganmcg1/software-agent-sdk.git@f69134273ee3a31a233d6201786570eb9c4c141b#subdirectory=openhands-sdk",
    "openhands-tools @ git+https://github.com/morganmcg1/software-agent-sdk.git@f69134273ee3a31a233d6201786570eb9c4c141b#subdirectory=openhands-tools",
    "psutil",
    # v2.16.2 is tagged upstream but has not been published to PyPI.
    "exa-py @ https://github.com/exa-labs/exa-py/archive/71f315b4be07d474df128c8fafc70cc7d0e47b56.tar.gz",
]

[tool.setuptools.packages.find]
include = ["senpai_agent*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
exclude-newer = "2026-09-27T00:00:00Z"
constraint-dependencies = [
    "cryptography>=50.0.0", # CVE-2026-69247 / GHSA-g6cj-pr64-35w5
]

[project.optional-dependencies]
dev = [
    "ipython",
    "pytest",
]
