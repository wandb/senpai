# senpai project configuration
# All fields can be overridden via CLI: python k8s/launch.py --tag <tag> [--field value]

# compute backend (kubernetes, docker, aws, or aws-mac)
backend: kubernetes

# active problem directory
# The entrypoint clones target_repo_url into this path at pod startup, so the
# problem-package repo's root ends up at ./target/ in the pod workspace.
problem_dir: target/

# Target-repository-relative program.md to append to every role's system
# prompt. Blank requires exactly one program.md at root or one level below.
program_path: ""

# Public Senpai runner source, fetched read-only. Override this only when the
# images were built from a fork or private Senpai repository.
senpai_repo_url: https://github.com/wandb/senpai.git
# Required only for digest-pinned images; source-SHA tags derive it automatically.
senpai_repo_revision: ""

# problem-package repo is REQUIRED and must be passed on the CLI
#   python k8s/launch.py --tag <tag> --target_repo_url https://github.com/<org>/<repo>.git
# The launcher creates advisor_branch from target_repo_branch when needed, then
# the entrypoint clones it into $PROBLEM_DIR.
target_repo_branch: ""

# docker images
# Required: use digests or matching sha-<full-commit> tags.
advisor_image: ""
student_image: ""

# Kubernetes target
kube_context: ""
namespace: default

# dataset PVC mount
pvc_claim_name: new-pvc
pvc_mount_path: /mnt/new-pvc

# Docker/AWS data root and standalone Docker host
docker_run_root: ~/.senpai/runs
docker_student_gpu_ids: ""
# Mounted directly by Docker or streamed once to AWS at pvc_mount_path.
data_dir: ""
docker_shm_size: 32g
docker_ready_timeout_s: 600

# AWS provisions one GPU host, then reuses the Docker backend on it.
aws_region: ""
aws_profile: ""
aws_instance_type: ""
aws_ami_id: ""
aws_subnet_id: ""
# Bootstrap floor; must fit the AMI and image-pull peak. Data can grow it afterward.
aws_volume_gib: 250
# Total free host disk retained for all role worktrees, checkpoints, caches, and logs.
aws_runtime_reserve_gib: 80
aws_state_root: ~/.senpai/aws
aws_ssh_cidr: ""
aws_ready_timeout_s: 1800
aws_data_timeout_s: 7200
# AWS Mac accepts 0 to disable scheduled shutdown; GPU AWS requires a positive TTL.
aws_ttl_hours: 24.0

# AWS Mac reuses allocated Dedicated Hosts and runs roles natively on macOS.
native_run_root: ~/.senpai/native
native_ready_timeout_s: 600
# A schema-v1 fleet manifest enables safe adoption of already-running instances.
aws_mac_nodes_path: ""
# fresh provisions instances; reuse requires aws_mac_nodes_path and aws_ttl_hours: 0.
aws_mac_bootstrap_mode: fresh
aws_mac_host_ids: ""
# Comma-separated AZ=subnet-id entries covering every selected host.
aws_mac_subnet_ids: ""
aws_mac_security_group_id: ""
# A full local Xcode copied to fresh base AMIs before native role startup.
aws_mac_xcode_app: /Applications/Xcode.app
aws_mac_xcode_archive: ""
# Required zip containing one exported Metal toolchain bundle.
aws_mac_metal_toolchain_archive: ""
aws_mac_mlxfast_bundle: ~/.local/share/mlxfast/mlxfast.js
# Set to install Yukon instead of MLXFast on fresh or adopted Macs.
aws_mac_yukon_bundle: ""
# Every active role receives the selected CLI's API token for official dispatch.
aws_mac_official_submit: false

# W&B
wandb_entity: wandb-applied-ai-team
wandb_project: senpai-v1

# Put additional credentials in .env, then list their names here to inject them
# into every advisor and student environment. For example:
# custom_secret_env_names:
#   - HF_TOKEN  # Set HF_TOKEN=abc123 in .env

# OpenHands models
advisor_model: openai/gpt-5.6-sol
advisor_reasoning_effort: xhigh
student_model: openai/gpt-5.6-sol
student_reasoning_effort: xhigh
smart_model: openai/gpt-5.6-sol
smart_reasoning_effort: xhigh
fast_model: openai/gpt-5.6-luna
fast_reasoning_effort: high
frontier_model: openai/gpt-5.6-sol
frontier_reasoning_effort: max
# Provider-native rendered/input-token trigger for supported compaction APIs.
compaction_trigger_tokens: 200000

# Local context fallback. Zero selects model-specific defaults.
local_condenser_max_events: 0
local_condenser_max_tokens: 0
local_condenser_target_events: 0

# advisor — the integration branch inside the problem-package repo that advisor PRs merge into
advisor_branch: schmidhuber
gh_history_scope: branch

# agent-facing training limits
timeout_minutes: 30.0
max_epochs: 50

# responsiveness / polling
poll_interval_s: 600
poll_jitter_s: 120
stale_wip_seconds: 7200
human_issues: true

# students
# Shared fleet defaults for Kubernetes, Docker, and AWS.
n_students: 4
student_prefix: ""
gpus_per_student: 1
cpu_per_gpu: 15
memory_gi_per_gpu: 120
preflight_only: false
