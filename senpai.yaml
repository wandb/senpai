# senpai project configuration
# All fields can be overridden via CLI: python k8s/launch.py --tag <tag> [--field value]

# compute backend (kubernetes, docker, or aws)
backend: kubernetes

# active problem directory
# The entrypoint clones target_repo_url into this path at pod startup, so the
# problem-package repo's root ends up at ./target/ in the pod workspace.
problem_dir: target/

# git (senpai itself)
repo_url: https://github.com/wandb/senpai.git
# Required only for digest-pinned images; source-SHA tags derive it automatically.
repo_revision: ""

# problem-package repo is REQUIRED and must be passed on the CLI
#   python k8s/launch.py --tag <tag> --target_repo_url https://github.com/<org>/<repo>.git
# The launcher creates advisor_branch from target_repo_branch when needed, then
# the entrypoint clones it into $PROBLEM_DIR.
target_repo_branch: ""

# docker images
# Required: use digests or matching sha-<full-commit> tags.
advisor_image: ""
student_image: ""

# Kubernetes target
kube_context: ""
namespace: default

# dataset PVC mount
pvc_claim_name: new-pvc
pvc_mount_path: /mnt/new-pvc

# Docker/AWS data root and standalone Docker host
docker_run_root: ~/.senpai/runs
docker_student_gpu_ids: ""
# Mounted directly by Docker or streamed once to AWS at pvc_mount_path.
data_dir: ""
docker_shm_size: 32g
docker_ready_timeout_s: 600

# AWS provisions one GPU host, then reuses the Docker backend on it.
aws_region: ""
aws_profile: ""
aws_instance_type: ""
aws_ami_id: ""
aws_subnet_id: ""
aws_volume_gib: 250
aws_state_root: ~/.senpai/aws
aws_ssh_cidr: ""
aws_ready_timeout_s: 900
aws_data_timeout_s: 7200
aws_ttl_hours: 24.0

# W&B
wandb_entity: wandb-applied-ai-team
wandb_project: senpai-v1

# OpenHands models
advisor_model: openai/gpt-5.6-sol
advisor_reasoning_effort: xhigh
student_model: openai/gpt-5.6-sol
student_reasoning_effort: xhigh
smart_model: openai/gpt-5.6-sol
smart_reasoning_effort: xhigh
fast_model: openai/gpt-5.6-luna
fast_reasoning_effort: high
frontier_model: openai/gpt-5.6-sol
frontier_reasoning_effort: max

# advisor — the integration branch inside the problem-package repo that advisor PRs merge into
advisor_branch: schmidhuber
gh_history_scope: branch

# training limits
timeout_minutes: 30.0
max_epochs: 50

# responsiveness / polling
poll_interval_s: 600
poll_jitter_s: 120
stale_wip_seconds: 7200
human_issues: true

# students
# -1 selects backend defaults: Kubernetes 4x8, Docker/AWS 1x1.
n_students: -1
student_prefix: ""
gpus_per_student: -1
cpu_per_gpu: 15
memory_gi_per_gpu: 120
preflight_only: false
