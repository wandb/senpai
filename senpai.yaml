# senpai project configuration
# All fields can be overridden via CLI: python k8s/launch.py --tag <tag> [--field value]

# active problem directory (repo-relative path — points at a submodule under target/)
problem: target/tandemfoil2

# git (senpai itself)
repo_url: https://github.com/wandb/senpai.git
repo_branch: main

# target submodule (agent commits/PRs land here, not in senpai)
target_repo_url: https://github.com/morganmcg1/tandemfoil2.git
target_working_branch: kagent_royal_rumble

# docker image
image: ghcr.io/wandb/senpai:latest

# dataset PVC mount
pvc_claim_name: new-pvc
pvc_mount_path: /mnt/new-pvc

# W&B
wandb_entity: wandb-applied-ai-team
wandb_project: senpai-v1

# advisor — the integration branch inside the target submodule that advisor PRs merge into
advisor_branch: kagent_royal_rumble

# training limits
timeout_minutes: 30.0
max_epochs: 50

# students
n_students: 4
